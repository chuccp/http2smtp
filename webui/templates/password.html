{{define "content"}}
<div class="page-head">
  <h1>{{.L.T "user.changePassword"}}</h1>
  <a class="btn" href="/dashboard">← {{.L.T "layout.sidebar.dashboard"}}</a>
</div>

<form method="post" action="/password" class="form card" style="max-width:480px">
  <label class="field">
    <span>{{.L.T "auth.currentPassword"}}</span>
    <input type="password" name="oldPassword" autocomplete="current-password" required>
  </label>
  <label class="field">
    <span>{{.L.T "settings.newPassword"}}</span>
    <input type="password" name="newPassword" autocomplete="new-password" required minlength="8">
  </label>
  <label class="field">
    <span>{{.L.T "setup.confirmPassword"}}</span>
    <input type="password" name="confirm" autocomplete="new-password" required minlength="8">
  </label>
  <div class="hint">{{.L.T "auth.passwordChanged"}}</div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{.L.T "common.save"}}</button>
  </div>
</form>
{{end}}
