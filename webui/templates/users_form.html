{{define "content"}}
<div class="page-head">
  <h1>{{if .Id}}{{.L.T "common.update"}}{{else}}{{.L.T "common.add"}}{{end}}</h1>
  <a class="btn" href="/users">← {{.L.T "layout.sidebar.users"}}</a>
</div>

<form method="post" action="/users/save" class="form card" style="max-width:480px">
  <input type="hidden" name="id" value="{{.Id}}">
  <label class="field">
    <span>{{.L.T "auth.username"}}</span>
    <input type="text" name="name" value="{{.Name}}" required>
  </label>
  <label class="field">
    <span>{{.L.T "settings.newPassword"}}</span>
    <input type="password" name="password" value="" autocomplete="new-password" {{if not .Id}}required{{end}} placeholder="{{if .Id}}{{.L.T "settings.passwordKeepHint"}}{{end}}">
  </label>
  <fieldset>
    <legend>{{.L.T "common.status"}}</legend>
    <label class="check">
      <input type="checkbox" name="isUse" {{if .IsUse}}checked{{end}}>
      {{.L.T "common.enable"}}
    </label>
    <br>
    <label class="check">
      <input type="checkbox" name="isAdmin" {{if .IsAdmin}}checked{{end}}>
      admin
    </label>
  </fieldset>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{.L.T "common.save"}}</button>
  </div>
</form>
{{end}}
