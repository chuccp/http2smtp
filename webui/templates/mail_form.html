{{define "content"}}
<div class="page-head">
  <h1>{{if .Id}}{{.L.T "mail.editRecipient"}}{{else}}{{.L.T "mail.addRecipient"}}{{end}}</h1>
  <a class="btn" href="/mail">← {{.L.T "layout.sidebar.mail"}}</a>
</div>

<form method="post" action="/mail/save" class="form card" style="max-width:480px">
  <input type="hidden" name="id" value="{{.Id}}">
  <label class="field">
    <span>{{.L.T "mail.recipientName"}}</span>
    <input type="text" name="name" value="{{.Name}}" required>
  </label>
  <label class="field">
    <span>{{.L.T "mail.emailAddress"}}</span>
    <input type="text" name="mail" value="{{.Mail}}" required>
  </label>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{.L.T "common.save"}}</button>
  </div>
</form>
{{end}}
