{{define "bodyClass"}} login-page{{end}}
{{define "cardClass"}} login-card{{end}}
{{define "content"}}
<div class="login-head">
  <div class="login-logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2.5"/>
      <path d="m3.5 7 8.5 6 8.5-6"/>
      <path d="M14 16h7"/>
      <path d="m18 13 3 3-3 3"/>
    </svg>
  </div>
  <div class="login-brand">HTTP2SMTP</div>
  <h1>{{.L.T "auth.login"}}</h1>
</div>
<form method="post" action="/login" class="form login-form">
  <input type="hidden" name="next" value="{{.Next}}">
  <label class="login-field">
    <span>{{.L.T "auth.username"}}</span>
    <div class="login-input">
      <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3-5.5 7-5.5s7 1.9 7 5.5"/>
      </svg>
      <input type="text" name="username" autofocus autocomplete="username" required>
    </div>
  </label>
  <label class="login-field">
    <span>{{.L.T "auth.password"}}</span>
    <div class="login-input password-wrap">
      <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>
      <input type="password" name="password" autocomplete="current-password" required>
      {{template "passwordToggle" .}}
    </div>
  </label>
  <div class="login-actions">
    <button type="submit" class="btn btn-primary login-submit">{{.L.T "auth.login"}}</button>
  </div>
</form>
{{end}}
